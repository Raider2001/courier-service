# Render blueprint: one FREE web service running the API + built React app.
#
# DEMO MODE (current): no Postgres service. DATABASE_URL stays unset, so the
# server uses embedded PGlite on the instance disk. The disk is ephemeral and
# setup.js runs on every boot, so the demo re-seeds itself fresh after every
# deploy or spin-down — perfect for a portfolio link that must never expire,
# wrong for real data.
#
# REAL-CLIENT MODE: uncomment the `databases:` block and the DATABASE_URL env
# var below, set SEED_DEMO to "false", and set real ADMIN_* values in the
# dashboard (see DEPLOY.md). Note: Render's free Postgres expires after 90
# days — use a paid plan or an external database for a real business.
#
# In Render: New -> Blueprint -> point at this repo.
services:
  - type: web
    name: courier
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    # setup.js is idempotent: creates tables if missing, seeds only when empty.
    startCommand: node server/db/setup.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "true"
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: courier-db
      #     property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Public demo credentials - also shown on the app's login page.
      - key: ADMIN_EMAIL
        value: admin@courier.local
      - key: ADMIN_PASSWORD
        value: changeme123
      - key: ADMIN_NAME
        value: Owner

