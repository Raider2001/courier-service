<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Courier — same-day deliveries, tracked door to door</title>
    <meta
      name="description"
      content="Local courier service. Book a delivery online, track it from pickup to drop-off, and see your full delivery history — no phone calls, no paperwork."
    />
    <meta name="theme-color" content="#101722" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Courier — same-day deliveries, tracked door to door" />
    <meta
      property="og:description"
      content="Book a delivery online, track it from pickup to drop-off, and see your full delivery history."
    />

    <!--
      Local SEO: fill this in with the real business details (name, town,
      opening hours, service area) before going live, then search engines can
      show the business for "courier near me" searches in her area.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Courier",
        "description": "Same-day courier and delivery service.",
        "areaServed": "Leeds and West Yorkshire",
        "url": "/",
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
