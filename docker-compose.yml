# Optional: run a real PostgreSQL server locally instead of the embedded PGlite
# database. You only need this if you want to test against the same engine the
# production host will use.
#
#   docker compose up -d
#   # then set in server/.env:
#   DATABASE_URL=postgresql://courier:courier@localhost:5432/courier
#   npm run db:setup

services:
  db:
    image: postgres:16-alpine
    container_name: courier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier
      POSTGRES_DB: courier
    ports:
      - "5432:5432"
    volumes:
      - courier-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier -d courier"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  courier-db-data:
